<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 单文件版：样式与脚本已内联 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>问道 · 修仙</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root{
  --ink:#15181f;
  --ink-soft:#2a3040;
  --paper:#eae3d2;
  --paper-dim:#c9c0ab;
  --jade:#5fbfa0;
  --jade-deep:#2f7f68;
  --gold:#d9b76a;
  --cinnabar:#c8503f;
  --line:rgba(217,183,106,.22);
}

html,body{ height:100%; }

body{
  font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC",serif;
  background:#0d1016;
  color:var(--paper);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 背景水墨 ---------- */
.ink-bg{ position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%, #23304a 0%, #141a26 45%, #0a0d13 100%);
}

.mist{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; }
.mist-a{ width:70vw; height:70vw; left:-20vw; top:-10vw;
  background:radial-gradient(circle,#2c6b63,transparent 65%); animation:drift 40s ease-in-out infinite; }
.mist-b{ width:60vw; height:60vw; right:-15vw; top:10vh;
  background:radial-gradient(circle,#3b4a7a,transparent 65%); animation:drift 55s ease-in-out infinite reverse; }
.mist-c{ width:80vw; height:50vw; left:10vw; bottom:-25vw;
  background:radial-gradient(circle,#5a4a72,transparent 68%); animation:drift 70s ease-in-out infinite; }

@keyframes drift{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(4vw,-3vh) scale(1.12); }
}

.mountains{ position:absolute; left:0; right:0; bottom:0; height:46vh;
  background:
    linear-gradient(to top, rgba(8,10,15,.95), transparent 70%),
    radial-gradient(60% 100% at 20% 100%, #1b2334, transparent 70%),
    radial-gradient(50% 100% at 55% 100%, #161d2b, transparent 70%),
    radial-gradient(70% 100% at 85% 100%, #1a2233, transparent 72%);
  clip-path:polygon(0 62%,10% 46%,20% 58%,32% 34%,44% 56%,55% 40%,66% 60%,78% 42%,90% 58%,100% 48%,100% 100%,0 100%);
  opacity:.85;
}

/* ---------- 布局 ---------- */
.app{ position:relative; z-index:1; height:100%;
  max-width:1080px; margin:0 auto; padding:14px 18px 12px;
  display:flex; flex-direction:column; gap:10px;
}

/* ---------- 顶栏 ---------- */
.topbar{ display:flex; align-items:center; gap:18px;
  padding:12px 16px; border:1px solid var(--line); border-radius:14px;
  background:linear-gradient(180deg, rgba(28,34,48,.86), rgba(18,22,32,.86));
  backdrop-filter:blur(8px);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.brand{ min-width:86px; }
.brand-title{ font-size:26px; letter-spacing:6px; color:var(--gold);
  text-shadow:0 0 18px rgba(217,183,106,.35); }
.brand-sub{ font-size:9px; letter-spacing:2px; color:rgba(234,227,210,.4);
  font-family:system-ui,sans-serif; }

.realm-box{ flex:1; min-width:180px; }
.realm-line{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
.realm-name{ font-size:19px; color:var(--paper); letter-spacing:2px; }
.realm-tag{ font-size:11px; color:var(--jade); border:1px solid rgba(95,191,160,.35);
  padding:1px 8px; border-radius:20px; }

.cult-bar{ position:relative; height:16px; border-radius:9px; overflow:hidden;
  background:rgba(0,0,0,.42); border:1px solid rgba(217,183,106,.18); }
.cult-fill{ height:100%; width:0%; border-radius:9px;
  background:linear-gradient(90deg,var(--jade-deep),var(--jade));
  box-shadow:0 0 14px rgba(95,191,160,.5); transition:width .25s linear; }
.cult-text{ position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:10.5px; letter-spacing:.5px;
  color:#eae3d2; text-shadow:0 1px 3px rgba(0,0,0,.9);
  font-family:system-ui,sans-serif; }

.stats{ display:flex; gap:16px; }
.stat{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.stat .k{ font-size:10px; color:rgba(234,227,210,.45); font-family:system-ui,sans-serif; }
.stat .v{ font-size:15px; color:var(--gold); font-family:system-ui,sans-serif; }

/* ---------- 页签 ---------- */
.tabs{ display:flex; gap:8px; }
.tab{ flex:1; padding:9px 4px; cursor:pointer; font-family:inherit;
  font-size:14.5px; letter-spacing:3px; color:rgba(234,227,210,.55);
  background:rgba(28,34,48,.6); border:1px solid rgba(217,183,106,.14);
  border-radius:10px; transition:.2s; }
.tab:hover{ color:var(--paper); border-color:rgba(217,183,106,.35); }
.tab.active{ color:#10141c; background:linear-gradient(180deg,var(--gold),#b9975a);
  border-color:transparent; box-shadow:0 0 18px rgba(217,183,106,.3); }

/* ---------- 面板 ---------- */
.panels{ flex:1; min-height:0; position:relative; }
.panel{ position:absolute; inset:0; display:none; gap:10px;
  grid-template-columns:1fr; overflow-y:auto; padding-right:4px; }
.panel.active{ display:grid; align-content:start; }
.panel::-webkit-scrollbar{ width:6px; }
.panel::-webkit-scrollbar-thumb{ background:rgba(217,183,106,.25); border-radius:3px; }

.card{ border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  background:linear-gradient(180deg, rgba(26,32,45,.82), rgba(17,21,30,.82));
  backdrop-filter:blur(8px); }

.card-title{ font-size:15px; letter-spacing:3px; color:var(--gold);
  margin-bottom:8px; font-weight:normal; }
.card-desc{ font-size:12px; color:rgba(234,227,210,.5); margin-bottom:12px;
  font-family:system-ui,sans-serif; }

/* ---------- 修炼 ---------- */
.focus-card{ display:grid; grid-template-columns:1fr 1.15fr; gap:18px; align-items:center; }

.meditate-btn{ position:relative; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; cursor:pointer;
  padding:22px 10px; border-radius:16px; font-family:inherit;
  color:var(--paper);
  background:radial-gradient(circle at 50% 30%, rgba(95,191,160,.22), rgba(0,0,0,.35));
  border:1px solid rgba(95,191,160,.3); transition:.15s; }
.meditate-btn:hover{ border-color:rgba(95,191,160,.6);
  box-shadow:0 0 24px rgba(95,191,160,.2); }
.meditate-btn:active{ transform:scale(.975); }

.seal{ position:absolute; font-size:104px; color:rgba(95,191,160,.08);
  user-select:none; pointer-events:none; }
.meditate-label{ font-size:22px; letter-spacing:8px; }
.meditate-hint{ font-size:11px; color:rgba(234,227,210,.55); font-family:system-ui,sans-serif; }
.meditate-hint b{ color:var(--jade); }

.break-box{ display:flex; flex-direction:column; gap:12px; }
.break-info .line{ font-size:13px; color:rgba(234,227,210,.7); margin-bottom:6px;
  font-family:system-ui,sans-serif; }
.break-info b{ color:var(--gold); }
.warn{ font-size:11px; color:rgba(200,80,63,.75); font-family:system-ui,sans-serif; }

.break-btn{ padding:12px; font-family:inherit; font-size:17px; letter-spacing:6px;
  cursor:pointer; border-radius:12px; color:#10141c; border:none;
  background:linear-gradient(180deg,var(--gold),#b9975a); transition:.2s; }
.break-btn:disabled{ cursor:not-allowed; opacity:.3; filter:grayscale(.6); }
.break-btn:not(:disabled):hover{ box-shadow:0 0 22px rgba(217,183,106,.45); }

/* ---------- 日志 ---------- */
.log-list{ list-style:none; display:flex; flex-direction:column; gap:6px;
  max-height:170px; overflow-y:auto; }
.log-list li{ font-size:12.5px; color:rgba(234,227,210,.72);
  font-family:system-ui,sans-serif; padding-left:12px; position:relative; }
.log-list li::before{ content:""; position:absolute; left:0; top:7px;
  width:4px; height:4px; border-radius:50%; background:var(--jade); }
.log-list li.hi{ color:var(--gold); }
.log-list li.hi::before{ background:var(--gold); }

/* ---------- 列表通用 ---------- */
.upgrade-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }

.up-item{ border:1px solid rgba(217,183,106,.16); border-radius:12px;
  padding:11px 13px; background:rgba(0,0,0,.22); display:flex;
  flex-direction:column; gap:7px; transition:.2s; }
.up-item:hover{ border-color:rgba(217,183,106,.38); }
.up-item.maxed{ opacity:.7; }
.up-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.up-name{ font-size:14px; color:var(--paper); letter-spacing:1px; }
.up-lv{ font-size:11px; color:var(--jade); font-family:system-ui,sans-serif; }
.up-desc{ font-size:11.5px; color:rgba(234,227,210,.5); line-height:1.5;
  font-family:system-ui,sans-serif; }
.up-foot{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.up-cost{ font-size:12px; color:var(--gold); font-family:system-ui,sans-serif; }
.up-btn{ padding:5px 14px; font-family:inherit; font-size:12.5px; cursor:pointer;
  border-radius:8px; border:1px solid rgba(95,191,160,.4); color:var(--jade);
  background:rgba(95,191,160,.08); transition:.18s; }
.up-btn:hover:not(:disabled){ background:rgba(95,191,160,.2); }
.up-btn:disabled{ cursor:not-allowed; opacity:.35; color:rgba(234,227,210,.5);
  border-color:rgba(234,227,210,.18); background:transparent; }

/* ---------- 秘境 ---------- */
.explore-wrap{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.explore-btn{ padding:11px 30px; font-family:inherit; font-size:16px; letter-spacing:4px;
  cursor:pointer; border-radius:11px; border:1px solid rgba(95,191,160,.4);
  color:var(--jade); background:rgba(95,191,160,.1); transition:.2s; }
.explore-btn:hover:not(:disabled){ background:rgba(95,191,160,.22); }
.explore-btn:disabled{ cursor:not-allowed; opacity:.4; }
.cd-bar{ flex:1; height:8px; border-radius:5px; overflow:hidden;
  background:rgba(0,0,0,.4); border:1px solid rgba(234,227,210,.1); }
.cd-fill{ height:100%; width:100%; background:linear-gradient(90deg,var(--jade-deep),var(--jade));
  transition:width .2s linear; }
.cd-text{ font-size:11px; color:rgba(234,227,210,.5); min-width:74px;
  font-family:system-ui,sans-serif; }

.secret-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.secret-item{ border:1px solid rgba(217,183,106,.14); border-radius:12px; padding:10px 12px;
  background:rgba(0,0,0,.2); }
.secret-item.locked{ opacity:.45; }
.secret-name{ font-size:13.5px; margin-bottom:4px; }
.secret-meta{ font-size:11px; color:rgba(234,227,210,.48); font-family:system-ui,sans-serif; }

/* ---------- 成就 ---------- */
.ach-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
.ach-item{ border:1px solid rgba(217,183,106,.14); border-radius:12px; padding:10px 12px;
  background:rgba(0,0,0,.2); display:flex; flex-direction:column; gap:6px; }
.ach-item.done{ border-color:rgba(217,183,106,.45); background:rgba(217,183,106,.07); }
.ach-name{ font-size:13.5px; color:var(--paper); }
.ach-desc{ font-size:11px; color:rgba(234,227,210,.48); font-family:system-ui,sans-serif; }
.ach-reward{ font-size:11.5px; color:var(--gold); font-family:system-ui,sans-serif; }

/* ---------- 页脚 ---------- */
.footer{ display:flex; justify-content:space-between; align-items:center; gap:12px;
  font-family:system-ui,sans-serif; }
.footer-note{ font-size:11px; color:rgba(234,227,210,.35); }
.footer-btns{ display:flex; gap:8px; }
.mini-btn{ padding:5px 12px; font-size:11.5px; cursor:pointer; border-radius:7px;
  font-family:inherit; color:rgba(234,227,210,.6);
  background:rgba(255,255,255,.05); border:1px solid rgba(234,227,210,.14); transition:.2s; }
.mini-btn:hover{ color:var(--paper); border-color:rgba(234,227,210,.35); }
.mini-btn.danger:hover{ color:#ff9d8c; border-color:rgba(200,80,63,.55); }

/* ---------- 提示 ---------- */
.toast{ position:fixed; left:50%; bottom:56px; transform:translate(-50%,20px);
  padding:10px 22px; border-radius:10px; font-size:13px; font-family:system-ui,sans-serif;
  background:rgba(12,16,23,.94); border:1px solid var(--line); color:var(--paper);
  opacity:0; pointer-events:none; transition:.28s; z-index:50; }
.toast.show{ opacity:1; transform:translate(-50%,0); }
.toast.good{ border-color:rgba(95,191,160,.6); color:var(--jade); }
.toast.bad{ border-color:rgba(200,80,63,.6); color:#e88a7a; }

@media (max-width:820px){
  .focus-card{ grid-template-columns:1fr; }
  .topbar{ flex-wrap:wrap; }
  .stats{ width:100%; justify-content:space-between; }
  .panel{ position:static; display:none; }
  .panel.active{ display:grid; }
  .panels{ overflow-y:auto; }
}

/* ============================================================
   新增：灵气粒子 / 境界闪光 / 打坐光环 / 卡头
   ============================================================ */

#qiCanvas{ position:fixed; inset:0; z-index:1; pointer-events:none; }

/* 突破成功时全屏金光一闪 */
.flash{ position:fixed; inset:0; z-index:40; pointer-events:none; opacity:0;
  background:radial-gradient(circle at 50% 42%, rgba(217,183,106,.55), rgba(217,183,106,0) 62%); }
.flash.on{ animation:flashAnim .85s ease-out; }
@keyframes flashAnim{
  0%   { opacity:0; }
  18%  { opacity:.9; }
  100% { opacity:0; }
}

/* 打坐按钮内的灵气光环，缓慢呼吸 */
.aura{ position:absolute; width:150px; height:150px; border-radius:50%;
  border:1px solid rgba(95,191,160,.28);
  box-shadow:0 0 30px rgba(95,191,160,.22) inset;
  animation:auraBreath 3.6s ease-in-out infinite; pointer-events:none; }
@keyframes auraBreath{
  0%,100%{ transform:scale(.86); opacity:.45; }
  50%    { transform:scale(1.12); opacity:.9; }
}

/* 卡片标题行 + 右侧小按钮 */
.card-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.card-head .card-title{ margin-bottom:0; }

/* 成就「已达成待领取」高亮 */
.ach-item.ready{ border-color:rgba(217,183,106,.6); background:rgba(217,183,106,.08);
  box-shadow:0 0 16px rgba(217,183,106,.18); }

/* 顶部区域层级高于粒子 */
.app{ z-index:2; }

/* 打坐按钮点击时的颗粒感 */
.meditate-btn:active .aura{ animation-duration:1.1s; }
</style>
</head>
<body>
<canvas id="qiCanvas"></canvas>

<div class="ink-bg">
  <div class="mist mist-a"></div>
  <div class="mist mist-b"></div>
  <div class="mist mist-c"></div>
  <div class="mountains"></div>
</div>

<div id="flash" class="flash"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-title">问道</div>
      <div class="brand-sub">IDLE CULTIVATION</div>
    </div>

    <div class="realm-box">
      <div class="realm-line">
        <span id="realmName" class="realm-name">炼气期 一层</span>
        <span id="realmRateTag" class="realm-tag">灵气 1.00 倍</span>
      </div>
      <div class="cult-bar">
        <div id="cultFill" class="cult-fill"></div>
        <span id="cultText" class="cult-text">0 / 6</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="k">灵石</span><span id="statStone" class="v">0</span></div>
      <div class="stat"><span class="k">修为 / 秒</span><span id="statRate" class="v">1.00</span></div>
      <div class="stat"><span class="k">突破率</span><span id="statChance" class="v">95%</span></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="cultivate">修 炼</button>
    <button class="tab" data-tab="technique">功 法</button>
    <button class="tab" data-tab="bag">丹 房</button>
    <button class="tab" data-tab="secret">秘 境</button>
    <button class="tab" data-tab="achievement">道 途</button>
  </nav>

  <main class="panels">

    <section class="panel active" id="panel-cultivate">
      <div class="card focus-card">
        <button id="btnMeditate" class="meditate-btn">
          <span class="seal">炁</span>
          <span class="aura"></span>
          <span class="meditate-label">打 坐</span>
          <span class="meditate-hint">每次 +<b id="meditateGain">2</b> 修为</span>
        </button>

        <div class="break-box">
          <div class="break-info">
            <div class="line">下一境界 <b id="nextRealm">炼气期 二层</b></div>
            <div class="line">所需修为 <b id="nextCost">6</b></div>
            <div class="line">成功率 <b id="breakChance">95%</b></div>
            <div class="line">突破得灵石 <b id="breakStone">8</b></div>
            <div class="warn">突破失败将损失部分修为</div>
          </div>
          <button id="btnBreak" class="break-btn" disabled>突 破</button>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">道途见闻</h3>
        <ul id="logList" class="log-list"></ul>
      </div>
    </section>

    <section class="panel" id="panel-technique">
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">功法传承</h3>
          <button id="btnBuyAll" class="mini-btn">一键修习</button>
        </div>
        <p class="card-desc">以灵石换取功法，永久提升修炼之效。</p>
        <div id="techList" class="upgrade-list"></div>
      </div>
    </section>

    <section class="panel" id="panel-bag">
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">丹房</h3>
          <button id="btnUseAll" class="mini-btn">尽数服下</button>
        </div>
        <p class="card-desc">秘境探索所得丹药，服之增益。</p>
        <div id="pillList" class="upgrade-list"></div>
      </div>
    </section>

    <section class="panel" id="panel-secret">
      <div class="card">
        <h3 class="card-title">秘境探索</h3>
        <p class="card-desc">境界越高，可探之处越险，所得亦越厚。</p>
        <div class="explore-wrap">
          <button id="btnExplore" class="explore-btn">探 索</button>
          <div class="cd-bar"><div id="cdFill" class="cd-fill"></div></div>
          <div id="cdText" class="cd-text">准备就绪</div>
        </div>
        <div id="secretList" class="secret-list"></div>
      </div>
    </section>

    <section class="panel" id="panel-achievement">
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">道途印记</h3>
          <button id="btnClaimAll" class="mini-btn">一键领取</button>
        </div>
        <p class="card-desc">达成后可领取灵石奖励。</p>
        <div id="achList" class="ach-list"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span class="footer-note" id="saveNote">自动存档中</span>
    <div class="footer-btns">
      <button id="btnExport" class="mini-btn">导出存档</button>
      <button id="btnImport" class="mini-btn">导入存档</button>
      <button id="btnReset" class="mini-btn danger">重开</button>
    </div>
  </footer>

</div>

<input type="file" id="importFile" accept=".json" hidden>
<div id="toast" class="toast"></div>

<script>

/* ===== config.js ===== */
/* ============================================================
   config.js —— 纯数据层
   想调平衡、加内容，只改这个文件，不用动逻辑和界面。
   ============================================================ */

/* 灵气倍率：每突破一个境界，基础收益乘以该值。
   调大 → 整体节奏变快；调小 → 变慢。这是最核心的一个旋钮。 */
const QI_MULT = 1.32;

/* 境界表：每个大境界的层数、修为需求基数、层间增幅、突破率 */
const REALMS = (() => {
  const major = [
    { name:"炼气期", tiers:9, base:6,      mult:1.32, rate:0.95, rateDrop:0.06 },
    { name:"筑基期", tiers:3, base:180,    mult:1.50, rate:0.85, rateDrop:0.08 },
    { name:"金丹期", tiers:3, base:1800,   mult:1.60, rate:0.75, rateDrop:0.09 },
    { name:"元婴期", tiers:3, base:16000,  mult:1.68, rate:0.66, rateDrop:0.09 },
    { name:"化神期", tiers:3, base:130000, mult:1.75, rate:0.58, rateDrop:0.09 },
    { name:"炼虚期", tiers:3, base:1.0e6,  mult:1.82, rate:0.50, rateDrop:0.09 },
    { name:"合体期", tiers:3, base:8.0e6,  mult:1.90, rate:0.43, rateDrop:0.09 },
    { name:"大乘期", tiers:3, base:6.5e7,  mult:1.98, rate:0.36, rateDrop:0.09 },
    { name:"渡劫期", tiers:3, base:5.2e8,  mult:2.06, rate:0.30, rateDrop:0.08 },

/* 数字格式化：1234 -> 1.23K，12345678 -> 1234万 */
function fmt(n) {
  if (n === Infinity) return "∞";
  if (!isFinite(n)) return "0";
  const abs = Math.abs(n);
  if (abs < 1000) return (Math.round(n * 10) / 10).toString().replace(/\.0$/, "");
  if (abs < 1e6)  return (n / 1e3).toFixed(2).replace(/\.?0+$/, "") + "K";
  if (abs < 1e8)  return (n / 1e4).toFixed(2).replace(/\.?0+$/, "") + "万";
  if (abs < 1e12) return (n / 1e8).toFixed(2).replace(/\.?0+$/, "") + "亿";
  return n.toExponential(2).replace("e+", "e");
}

/* 整数格式化 */
function fmtInt(n) { return fmt(Math.floor(n)); }

/* 百分比 */
function pct(x, digits) { return (x * 100).toFixed(digits === undefined ? 1 : digits) + "%"; }

/* 秒 -> 12分34秒 */
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + "秒";
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + "分" + (s ? s + "秒" : "");
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return h + "时" + (mm ? mm + "分" : "");
  return Math.floor(h / 24) + "天" + (h % 24 ? (h % 24) + "时" : "");
}

/* [min,max] 随机 */
function rndInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
function rndFloat(min, max) { return min + Math.random() * (max - min); }

/* 按概率挑选：table = {key: [概率下限, 概率上限]} */
function pickWeighted(chanceTable) {
  const roll = Math.random();
  let acc = 0;
  const keys = Object.keys(chanceTable);
  for (const k of keys) {
    const [lo, hi] = chanceTable[k];
    const p = rndFloat(lo, hi);
    acc += p;
    if (roll <= acc) return k;
  }
  return null;
}

  };
}

/* 补齐字段：老存档缺的键用默认值补上 */
function migrate(s) {
  const d = defaultState();
  const out = Object.assign({}, d, s);
  out.stats = Object.assign({}, d.stats, s.stats || {});
  out.explore = Object.assign({}, d.explore, s.explore || {});
  out.explore.counts = (s.explore && s.explore.counts) || {};
  out.techniques = s.techniques || {};
  out.pills = s.pills || {};
  out.achievements = s.achievements || {};
  out.buffs = Array.isArray(s.buffs) ? s.buffs : [];
  out.logs = Array.isArray(s.logs) ? s.logs : [];
  out.version = SAVE_VERSION;
  return out;
}

/* 存档 */
function saveState(s) {
  try {
    s.lastSave = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
    return true;
  } catch (e) {
    console.warn("存档失败", e);
    return false;
  }
}

/* 读档：无档或损坏则返回 null */
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    return migrate(parsed);
  } catch (e) {
    console.warn("读档失败", e);
    return null;
  }
}

/* 清档 */
function clearState() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}


/* ===== logic.js ===== */
/* ============================================================
   logic.js —— 逻辑层（纯计算，不碰界面，可单独测试）
   ============================================================ */

/* ---------- 功法等级与加成 ---------- */
function techLv(s, id) { return s.techniques[id] || 0; }

/* 某条属性上所有功法的加成总和（线性累加） */
function techBonus(s, unit) {
  let sum = 0;
  for (const t of TECHNIQUES) if (t.unit === unit) sum += t.gain * techLv(s, t.id);
  return sum;
}

/* ---------- 药力 buff ---------- */
function activeBuffs(s, now) {
  const t = now === undefined ? Date.now() : now;
  return s.buffs.filter(b => b.until > t);
}
function pruneBuffs(s, now) {
  const t = now === undefined ? Date.now() : now;
  s.buffs = s.buffs.filter(b => b.until > t);
}
function buffBonus(s, stat, now) {
  let sum = 0;
  for (const b of activeBuffs(s, now)) if (b.stat === stat) sum += b.value;
  return sum;
}
/* 同名药力取「更晚的到期时间」，不叠加时长，避免连点无限续 */
function addBuff(s, id, name, stat, value, dur, color) {
  const now = Date.now();
  const until = now + dur * 1000;
  const exist = s.buffs.find(b => b.id === id);
  if (exist) {
    exist.until = Math.max(exist.until, until);
    exist.value = Math.max(exist.value, value);
  } else {
    s.buffs.push({ id, name, stat, value, until, color: color || "#5fbfa0" });
  }
}

/* ---------- 核心数值 ---------- */
/* 境界灵气倍率：每上一境，基础收益乘以 QI_MULT */
function realmQi(s) { return Math.pow(QI_MULT, s.realm); }

/* 功法带来的总增益系数（全部加总后 +1） */
function techFactor(s, unit) {
  return 1 + techBonus(s, unit) + techBonus(s, "全部收益");
}

/* 每秒自动修为 */
function autoRate(s, now) {
  const base = 1;
  const qi = realmQi(s) * (1 + buffBonus(s, "qi", now));
  return base * qi * (1 + techBonus(s, "自动灵气") + techBonus(s, "引气效率") + techBonus(s, "全部收益"));
}

/* 单次打坐所得 */
function clickGain(s, now) {
  const base = 2;
  const qi = realmQi(s) * (1 + buffBonus(s, "qi", now));
  const mult = 1 + techBonus(s, "每次打坐") + techBonus(s, "引气效率") + techBonus(s, "全部收益");
  return base * qi * mult * (1 + buffBonus(s, "click", now));
}

/* 突破成功率（上限 99%） */
function breakChance(s, now) {
  const r = REALMS[s.realm];
  const bonus = techBonus(s, "突破成功率") + buffBonus(s, "rate", now);
  return Math.min(0.99, r.rate + bonus);
}

/* 突破失败保留的修为比例 */
function failKeep(s) { return Math.min(0.98, 0.7 + techBonus(s, "失败保留修为")); }

/* 升至下一境所需修为 */
function needCultivation(s) {
  const next = REALMS[s.realm + 1];
  return next ? next.need : Infinity;
}
function isMaxRealm(s) { return s.realm >= REALMS.length - 1; }

/* ---------- 灵石 ---------- */
function addStones(s, n) {
  n = Math.floor(n);
  if (n <= 0) return;
  s.stones += n;
  s.totalStones += n;
}
/* 突破奖励灵石：随境界指数增长，越到后期越是主要来源 */
function breakStoneReward(s) {
  return Math.floor(8 * Math.pow(1.55, s.realm));
}

/* ---------- 打坐 ---------- */
function doMeditate(s) {
  const g = clickGain(s, Date.now());
  s.cultivation += g;
  s.totalClicks++;
  return g;
}

/* ---------- 突破 ---------- */
function doBreak(s) {
  const now = Date.now();
  if (isMaxRealm(s)) return { ok:false, maxed:true };
  const need = needCultivation(s);
  if (s.cultivation < need) return { ok:false, lack:true, chance:breakChance(s, now) };

  const chance = breakChance(s, now);
  s.stats.breaks++;
  const ok = Math.random() < chance;

  if (ok) {
    s.cultivation -= need;
    s.realm++;
    s.stats.bestRealm = Math.max(s.stats.bestRealm, s.realm);
    const stones = breakStoneReward(s);
    addStones(s, stones);
    return { ok:true, chance, realm:REALMS[s.realm], stones };
  } else {
    s.cultivation = Math.max(0, s.cultivation * failKeep(s));
    s.stats.breakFails++;
    return { ok:false, chance };
  }
}

/* ---------- 功法 ---------- */
function techCost(s, t) {
  return Math.floor(t.costBase * Math.pow(t.costMult, techLv(s, t.id)));
}
function canBuyTech(s, t) {
  return techLv(s, t.id) < t.max && s.stones >= techCost(s, t);
}
function buyTech(s, t) {
  if (!canBuyTech(s, t)) return false;
  s.stones -= techCost(s, t);
  s.techniques[t.id] = techLv(s, t.id) + 1;
  return true;
}
/* 一键买下当前买得起的所有功法，返回总花费 */
function buyAllAffordable(s) {
  let spent = 0, count = 0;
  let changed = true;
  while (changed) {
    changed = false;
    for (const t of TECHNIQUES) {
      if (canBuyTech(s, t)) { s.stones -= techCost(s, t); spent += techCost(s, t); s.techniques[t.id] = techLv(s, t.id) + 1; count++; changed = true; }
    }
  }
  return { spent, count };
}

/* ---------- 丹药 ---------- */
function usePill(s, id) {
  if (!s.pills[id] || s.pills[id] <= 0) return null;
  const p = PILLS[id];
  if (!p) return null;
  s.pills[id]--;

  if (p.kind === "burst") {
    const amount = autoRate(s) * 60;
    s.cultivation += amount;
    return { name:p.name, kind:"burst", amount };
  }
  addBuff(s, "pill_" + id, p.name, p.stat, p.value, p.dur, p.color);
  return { name:p.name, kind:"buff", dur:p.dur };
}

/* ---------- 秘境 ---------- */
function secretUnlocked(s, sec) { return s.realm >= sec.unlockRealm; }
function secretReady(s, now) {
  const t = now === undefined ? Date.now() : now;
  return t >= (s.explore.cooldownUntil || 0);
}
function exploreCooldownLeft(s, now) {
  const t = now === undefined ? Date.now() : now;
  return Math.max(0, ((s.explore.cooldownUntil || 0) - t) / 1000);
}
function doExplore(s) {
  const now = Date.now();
  const pool = SECRETS.filter(sec => secretUnlocked(s, sec));
  if (!pool.length) return { ok:false, locked:true };
  if (!secretReady(s, now)) return { ok:false, cd:exploreCooldownLeft(s, now) };

  const sec = pool[Math.floor(Math.random() * pool.length)];
  const stones = rndInt(sec.stone[0], sec.stone[1]);
  addStones(s, stones);

  const got = [];
  const key = pickWeighted(sec.pills);
  if (key && PILLS[key]) {
    const n = rndInt(1, 2);
    s.pills[key] = (s.pills[key] || 0) + n;
    got.push({ id:key, n });
  }

  s.explore.counts[sec.id] = (s.explore.counts[sec.id] || 0) + 1;
  s.explore.total++;
  s.explore.cooldownUntil = now + sec.cd * 1000;
  s.explore.cooldownTotal = sec.cd;
  return { ok:true, secret:sec, stones, pills:got, cd:sec.cd };
}

/* ---------- 成就 ---------- */
const ACH_TEST = {
  first:    s => s.totalClicks >= 1,
  tier3:    s => s.realm >= 2,
  zhuji:    s => s.realm >= 9,
  jindan:   s => s.realm >= 12,
  yuanying: s => s.realm >= 15,
  immortal: s => s.realm >= REALMS.length - 1,
  click100: s => s.totalClicks >= 100,
  exp10:    s => s.explore.total >= 10,
  rich:     s => s.totalStones >= 10000,
  tuna:     s => Object.values(s.techniques).some(v => v >= 10)
};
function achDone(s, a) { return !!(ACH_TEST[a.id] && ACH_TEST[a.id](s)); }
function achClaimed(s, a) { return !!s.achievements[a.id]; }
function claimAch(s, a) {
  if (achClaimed(s, a) || !achDone(s, a)) return false;
  s.achievements[a.id] = Date.now();
  addStones(s, a.reward);
  return true;
}
/* 返回所有「已达成但未领取」的成就 */
function claimableAch(s) {
  return ACHIEVEMENTS.filter(a => achDone(s, a) && !achClaimed(s, a));
}

/* ---------- 离线结算 ---------- */
/* 按时间戳补算，最多按 8 小时计，防止长时间放置无限膨胀 */
const OFFLINE_CAP_SEC = 8 * 3600;
function offlineGain(s) {
  const now = Date.now();
  const elapsed = Math.max(0, (now - (s.lastTick || now)) / 1000);
  if (elapsed < 60) return { seconds:0, gain:0, realSeconds:elapsed };
  const capped = Math.min(elapsed, OFFLINE_CAP_SEC);
  const gain = autoRate(s, now) * capped;
  s.cultivation += gain;
  return { seconds:capped, gain, realSeconds:elapsed };
}

/* ---------- 主循环 ---------- */
function tick(s, dtSec) {
  const now = Date.now();
  pruneBuffs(s, now);
  s.cultivation += autoRate(s, now) * dtSec;
  s.lastTick = now;
}

/* ---------- 日志 ---------- */
function pushLog(s, text, hi) {
  s.logs.unshift({ t:Date.now(), text, hi:!!hi });
  if (s.logs.length > 60) s.logs.length = 60;
}

/* 只更新数字文本，避免无谓重排 */
function setText(node, val) { if (node && node.textContent !== val) node.textContent = val; }

/* ---------- 顶部 ---------- */
let lastRealm = -1;

function drawTop(s) {
  const now = Date.now();
  const r = REALMS[s.realm];
  const maxed = isMaxRealm(s);

  setText(el.realmName, r.label);
  setText(el.realmRateTag, "灵气 " + realmQi(s).toFixed(2) + " 倍");

  if (maxed) {
    el.cultFill.style.width = "100%";
    setText(el.cultText, "已臻化境");
  } else {
    const need = needCultivation(s);
    const p = Math.max(0, Math.min(1, s.cultivation / need));
    el.cultFill.style.width = (p * 100).toFixed(2) + "%";
    setText(el.cultText, fmtInt(s.cultivation) + " / " + fmtInt(need));
  }

  setText(el.statStone,  fmtInt(s.stones));
  setText(el.statRate,   autoRate(s, now).toFixed(2));
  setText(el.statChance, maxed ? "—" : pct(breakChance(s, now), 1));

  /* 境界变化时闪一下金光 */
  if (lastRealm !== -1 && s.realm !== lastRealm) flash();
  lastRealm = s.realm;
}

/* ---------- 修炼 ---------- */
function drawCultivate(s) {
  const now = Date.now();
  const maxed = isMaxRealm(s);

  setText(el.meditateGain, fmtInt(clickGain(s, now)));

  if (maxed) {
    setText(el.nextRealm, "已至绝顶");
    setText(el.nextCost, "—");
    setText(el.breakChance, "—");
    setText(el.breakStone, "—");
    el.btnBreak.disabled = true;
  } else {
    const next = REALMS[s.realm + 1];
    setText(el.nextRealm, next.label);
    setText(el.nextCost, fmtInt(next.need));
    setText(el.breakChance, pct(breakChance(s, now), 1));
    setText(el.breakStone, fmtInt(breakStoneReward(s)));
    el.btnBreak.disabled = s.cultivation < next.need;
  }
}

function drawLogs(s) {
  const html = s.logs.slice(0, 24).map(l =>
    '<li class="' + (l.hi ? "hi" : "") + '">' + escapeHtml(l.text) + "</li>"
  ).join("");
  if (el.logList.innerHTML !== html) el.logList.innerHTML = html || "<li>尚无见闻</li>";
}

/* ---------- 功法 ---------- */
function drawTech(s) {
  el.techList.innerHTML = TECHNIQUES.map(t => {
    const lv = techLv(s, t.id);
    const maxed = lv >= t.max;
    const can = canBuyTech(s, t);
    const total = t.gain * lv;
    const isSpecial = (t.unit === "突破成功率" || t.unit === "失败保留修为");
    const totalText = isSpecial ? "+" + pct(total, 1) : "+" + (total * 100).toFixed(0) + "%";
    return [
      '<div class="up-item' + (maxed ? " maxed" : "") + '">',
        '<div class="up-head">',
          '<span class="up-name">' + t.name + '</span>',
          '<span class="up-lv">' + lv + " / " + t.max + "</span>",
        "</div>",
        '<div class="up-desc">' + t.desc + "<br>当前 " + t.unit + " " + totalText + "</div>",
        '<div class="up-foot">',
          '<span class="up-cost">' + (maxed ? "已圆满" : "灵石 " + fmtInt(techCost(s, t))) + "</span>",
          '<button class="up-btn" data-buy="' + t.id + '"' + (can ? "" : " disabled") + ">" +
            (maxed ? "圆满" : "修习") + "</button>",
        "</div>",
      "</div>"
    ].join("");
  }).join("");
}

/* ---------- 丹房 ---------- */
function drawPills(s) {
  const now = Date.now();
  const buffs = activeBuffs(s, now);
  const buffsHtml = buffs.map(b => {
    const left = Math.ceil((b.until - now) / 1000);
    return '<span class="realm-tag" style="color:' + b.color + ";border-color:" + b.color +
      '">' + b.name + " " + fmtTime(left) + "</span>";
  }).join(" ");

  const cards = Object.keys(PILLS).map(id => {
    const p = PILLS[id];
    const n = s.pills[id] || 0;
    return [
      '<div class="up-item' + (n ? "" : " maxed") + '">',
        '<div class="up-head">',
          '<span class="up-name" style="color:' + p.color + '">' + p.name + "</span>",
          '<span class="up-lv">×' + fmtInt(n) + "</span>",
        "</div>",
        '<div class="up-desc">' + p.desc + "</div>",
        '<div class="up-foot">',
          '<span class="up-cost">' + (n ? "可服用" : "尚未获得") + "</span>",
          '<button class="up-btn" data-pill="' + id + '"' + (n ? "" : " disabled") + ">服用</button>",
        "</div>",
      "</div>"
    ].join("");
  }).join("");

  const buffCard = buffsHtml
    ? '<div class="up-item" style="grid-column:1/-1"><div class="up-desc">当前药力：' + buffsHtml + "</div></div>"
    : "";

  el.pillList.innerHTML = cards + buffCard;
}

/* ---------- 秘境 ---------- */
function drawSecret(s) {
  const now = Date.now();
  const left = exploreCooldownLeft(s, now);
  const ready = left <= 0;

  el.btnExplore.disabled = !ready;
  setText(el.cdText, ready ? "准备就绪" : fmtTime(left));

  if (ready) {
    el.cdFill.style.width = "100%";
  } else {
    const cd = s.explore.cooldownTotal || 1;
    el.cdFill.style.width = (Math.max(0, 1 - left / cd) * 100).toFixed(1) + "%";
  }

  el.secretList.innerHTML = SECRETS.map(sec => {
    const ok = secretUnlocked(s, sec);
    const cnt = s.explore.counts[sec.id] || 0;
    return [
      '<div class="secret-item' + (ok ? "" : " locked") + '">',
        '<div class="secret-name">' + sec.name + (ok ? "" : " 🔒") + "</div>",
        '<div class="secret-meta">' +
          (ok
            ? "灵石 " + fmtInt(sec.stone[0]) + "~" + fmtInt(sec.stone[1]) + " · 已探 " + cnt + " 次"
            : "需 " + REALMS[sec.unlockRealm].label) +
        "</div>",
      "</div>"
    ].join("");
  }).join("");
}

/* ---------- 成就 ---------- */
function drawAch(s) {
  el.achList.innerHTML = ACHIEVEMENTS.map(a => {
    const done = achDone(s, a);
    const claimed = achClaimed(s, a);
    let right;
    if (claimed)      right = '<span class="ach-reward">已领取</span>';
    else if (done)    right = '<button class="up-btn" data-ach="' + a.id + '">领取 ' + fmtInt(a.reward) + "</button>";
    else              right = '<span class="ach-reward">灵石 ' + fmtInt(a.reward) + "</span>";

    return [
      '<div class="ach-item' + (claimed ? " done" : done ? " ready" : "") + '">',
        '<div class="up-head"><span class="ach-name">' + a.name + "</span>" + right + "</div>",
        '<div class="ach-desc">' + a.desc + "</div>",
      "</div>"
    ].join("");
  }).join("");
}

/* ---------- 重绘 ---------- */
let lastPanel = "cultivate";

function drawAll(s) {
  drawTop(s);
  drawLogs(s);
  switch (lastPanel) {
    case "cultivate":   drawCultivate(s); break;
    case "technique":   drawTech(s); break;
    case "bag":         drawPills(s); break;
    case "secret":      drawSecret(s); break;
    case "achievement": drawAch(s); break;
  }
}

/* 每帧只刷新会动的部分，省性能 */
let bagAcc = 0;
function drawFast(s, dt) {
  drawTop(s);
  if (lastPanel === "cultivate") drawCultivate(s);
  if (lastPanel === "secret")    drawSecret(s);
  if (lastPanel === "bag") {                 // 药力倒计时要走字，约 4 次/秒
    bagAcc += dt;
    if (bagAcc >= 0.25) { bagAcc = 0; drawPills(s); }
  }
}

/* ---------- 反馈 ---------- */
let toastTimer = null;
function toast(msg, kind) {
  el.toast.textContent = msg;
  el.toast.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.className = "toast"; }, 1900);
}

function flash() {
  el.flash.classList.remove("on");
  void el.flash.offsetWidth;      // 强制重排，让动画能重复触发
  el.flash.classList.add("on");
}


/* ===== game.js ===== */
/* ============================================================
   game.js —— 循环层 / 事件绑定：把 config、state、logic、ui 串起来
   ============================================================ */

let S = null;
let lastFrame = performance.now();
let autosaveAcc = 0;

/* ---------- 启动 ---------- */
function boot() {
  const loaded = loadState();

  if (loaded) {
    S = loaded;
    const off = offlineGain(S);
    if (off.seconds >= 60) {
      const gainText = fmtInt(off.gain);
      pushLog(S, "闭关 " + fmtTime(off.realSeconds) + "，修为 +" + gainText, true);
      setTimeout(() => toast("闭关归来 · 修为 +" + gainText, "good"), 400);
    } else {
      pushLog(S, "重返道途。", false);
    }
  } else {
    S = defaultState();
    pushLog(S, "你于青石之上盘膝而坐，天地灵气缓缓入体。", true);
    pushLog(S, "点击「打坐」，开始你的道途。", false);
  }

  S.lastTick = Date.now();
  bindEvents();
  initParticles();
  drawAll(S);            // 首屏完整绘制（含日志），否则日志区空白
  requestAnimationFrame(loop);
}

/* ---------- 主循环 ---------- */
function loop(now) {
  const dt = Math.min(0.5, (now - lastFrame) / 1000);   // 掉帧时最多补算 0.5 秒
  lastFrame = now;

  tick(S, dt);

  autosaveAcc += dt * 1000;
  if (autosaveAcc >= AUTOSAVE_MS) { autosaveAcc = 0; doSave(true); }

  drawFast(S, dt);
  stepParticles(dt);

  requestAnimationFrame(loop);
}

/* ---------- 存档 ---------- */
function doSave(silent) {
  const ok = saveState(S);
  el.saveNote.textContent = ok
    ? "已存档 · " + new Date().toLocaleTimeString("zh-CN", { hour12: false })
    : "存档失败";
  if (!silent) toast(ok ? "已存档" : "存档失败", ok ? "good" : "bad");
}

/* ============================================================
   灵气粒子：canvas 上浮的淡青光点，纯装饰
   ============================================================ */
let cv = null, cx = null, particles = [], dpr = 1;

function initParticles() {
  cv = document.getElementById("qiCanvas");
  if (!cv) return;
  cx = cv.getContext("2d");
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  particles = [];
  for (let i = 0; i < 46; i++) particles.push(newParticle(true));
}

function resizeCanvas() {
  if (!cv) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.floor(window.innerWidth  * dpr);
  cv.height = Math.floor(window.innerHeight * dpr);
  cv.style.width  = window.innerWidth + "px";
  cv.style.height = window.innerHeight + "px";
}

function newParticle(spread) {
  return {
    x: Math.random() * (cv ? cv.width : 800),
    y: spread ? Math.random() * (cv ? cv.height : 600) : (cv ? cv.height : 600) + 20,
    r: (0.6 + Math.random() * 2.1) * dpr,
    vy: -(6 + Math.random() * 26) * dpr,
    vx: (Math.random() - 0.5) * 10 * dpr,
    a: 0.12 + Math.random() * 0.4,
    hue: Math.random() < 0.72 ? 162 : 44          // 青绿为主，少量金色
  };
}

function stepParticles(dt) {
  if (!cx || !cv) return;
  cx.clearRect(0, 0, cv.width, cv.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    /* 爆裂粒子（带 life）：边飞边淡，寿命尽则移除 */
    if (p.life !== undefined) {
      p.life -= dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const alpha = Math.max(0, p.a * (p.life / 1.1));
      const grd = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      grd.addColorStop(0, "hsla(" + p.hue + ",80%,72%," + alpha + ")");
      grd.addColorStop(1, "hsla(" + p.hue + ",80%,72%,0)");
      cx.fillStyle = grd;
      cx.beginPath();
      cx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2);
      cx.fill();
      continue;
    }

    /* 常驻灵气：飘出顶部后回收到底部 */
    if (p.y < -30) particles[i] = newParticle(false);
    const grd = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
    grd.addColorStop(0, "hsla(" + p.hue + ",72%,68%," + p.a + ")");
    grd.addColorStop(1, "hsla(" + p.hue + ",72%,68%,0)");
    cx.fillStyle = grd;
    cx.beginPath();
    cx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
    cx.fill();
  }
}
/* 切换页签：点击页签与网址直达共用这一段 */
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  lastPanel = name;
  drawAll(S);
}

/* ============================================================
   事件绑定
   ============================================================ */
function bindEvents() {

  /* 页签切换 */
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  /* 允许用网址尾巴直达某页，例如 index.html#secret */
  const hash = (location.hash || "").replace("#", "");
  if (hash && document.querySelector('.tab[data-tab="' + hash + '"]')) switchTab(hash);

  /* 打坐 */
  el.btnMeditate.addEventListener("click", () => {
    const g = doMeditate(S);
    if (S.totalClicks === 1) pushLog(S, "初次入定，气感微生。", false);
    if (S.totalClicks % 100 === 0) pushLog(S, "已打坐 " + S.totalClicks + " 次。", false);
    drawCultivate(S);
  });

  /* 突破 */
  el.btnBreak.addEventListener("click", () => {
    const r = doBreak(S);
    if (r.maxed) { toast("已至绝顶，无从突破", "bad"); return; }
    if (r.lack)  { toast("修为不足，尚需苦修", "bad"); return; }

    if (r.ok) {
      pushLog(S, "突破成功，踏入「" + r.realm.label + "」，得灵石 " + fmtInt(r.stones) + "。", true);
      toast("突破成功 · " + r.realm.label, "good");
      burstParticles();
    } else {
      pushLog(S, "突破失败，气机溃散，修为受损。", false);
      toast("突破失败（成算 " + pct(r.chance, 0) + "）", "bad");
    }
    drawAll(S);
  });

  /* 功法 / 丹药 / 成就 —— 事件委托 */
  document.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;

    if (b.dataset.buy) {
      const t = TECHNIQUES.find(x => x.id === b.dataset.buy);
      if (t && buyTech(S, t)) {
        toast(t.name + " 提升至 " + techLv(S, t.id) + " 级", "good");
        drawAll(S);
      }
      return;
    }

    if (b.dataset.pill) {
      const r = usePill(S, b.dataset.pill);
      if (r) {
        if (r.kind === "burst") toast("服下" + r.name + " · 修为 +" + fmtInt(r.amount), "good");
        else                    toast("服下" + r.name + " · 药力 " + r.dur + " 秒", "good");
        pushLog(S, "服下「" + r.name + "」。", false);
        drawAll(S);
      }
      return;
    }

    if (b.dataset.ach) {
      const a = ACHIEVEMENTS.find(x => x.id === b.dataset.ach);
      if (a && claimAch(S, a)) {
        toast("「" + a.name + "」得灵石 " + fmtInt(a.reward), "good");
        drawAll(S);
      }
      return;
    }
  });

  /* 一键修习 */
  document.getElementById("btnBuyAll").addEventListener("click", () => {
    const r = buyAllAffordable(S);
    if (!r.count) { toast("灵石不足，尚无可修之法", "bad"); return; }
    toast("修习 " + r.count + " 次，耗灵石 " + fmtInt(r.spent), "good");
    drawAll(S);
  });

  /* 尽数服下 */
  document.getElementById("btnUseAll").addEventListener("click", () => {
    const ids = Object.keys(PILLS).filter(id => (S.pills[id] || 0) > 0);
    if (!ids.length) { toast("已无丹药可用", "bad"); return; }
    let total = 0;
    for (const id of ids) {
      /* 持续类丹药同时只生效一枚（多服不叠加），爆发类可一次吃光 */
      const limit = PILLS[id].kind === "burst" ? S.pills[id] : 1;
      let used = 0;
      for (let k = 0; k < limit; k++) { if (!usePill(S, id)) break; used++; }
      if (used) { total += used; pushLog(S, "服下「" + PILLS[id].name + "」×" + used + "。", false); }
    }
    toast("共服下 " + total + " 枚丹药", "good");
    drawAll(S);
  });

  /* 一键领取 */
  document.getElementById("btnClaimAll").addEventListener("click", () => {
    const list = claimableAch(S);
    if (!list.length) { toast("暂无可领之赏", "bad"); return; }
    let sum = 0;
    for (const a of list) if (claimAch(S, a)) sum += a.reward;
    toast("领取 " + list.length + " 项，共得灵石 " + fmtInt(sum), "good");
    drawAll(S);
  });

  /* 秘境探索 */
  el.btnExplore.addEventListener("click", () => {
    const r = doExplore(S);
    if (!r.ok) {
      if (r.locked) toast("尚无可用秘境", "bad");
      else if (r.cd) toast("需再等 " + fmtTime(r.cd), "bad");
      return;
    }
    let msg = "探索「" + r.secret.name + "」，灵石 +" + fmtInt(r.stones);
    if (r.pills.length) msg += "，" + r.pills.map(p => PILLS[p.id].name + "×" + p.n).join("、");
    pushLog(S, msg, true);
    toast(msg, "good");
    burstParticles();
    drawAll(S);
  });

  /* 导出 */
  document.getElementById("btnExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    a.href = URL.createObjectURL(blob);
    a.download = "xiuxian_save_" + stamp + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("已导出存档", "good");
  });

  /* 导入 */
  document.getElementById("btnImport").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const obj = JSON.parse(fr.result);
        if (!obj || typeof obj !== "object") throw new Error("格式不对");
        S = migrate(obj);
        S.lastTick = Date.now();
        doSave(true);
        drawAll(S);
        toast("存档已导入", "good");
      } catch (e) {
        toast("导入失败：不是有效存档", "bad");
      }
    };
    fr.readAsText(f);
    ev.target.value = "";
  });

  /* 重开 */
  document.getElementById("btnReset").addEventListener("click", () => {
    if (!confirm("确定重开？当前进度将全部清空。")) return;
    clearState();
    S = defaultState();
    pushLog(S, "重头再来，道途再启。", true);
    doSave(true);
    drawAll(S);
    toast("已重开", "good");
  });

  /* 离开页面前落盘 */
  window.addEventListener("beforeunload", () => saveState(S));
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveState(S); });

  /* 键盘：空格打坐，回车突破 —— 手速党的福音 */
  document.addEventListener("keydown", ev => {
    const tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (ev.code === "Space") { ev.preventDefault(); el.btnMeditate.click(); }
    if (ev.code === "Enter" && !el.btnBreak.disabled) { ev.preventDefault(); el.btnBreak.click(); }
  });
}

/* 突破 / 探索成功时炸出一圈粒子 */
function burstParticles() {
  if (!cv || !cx) return;
  const cxp = cv.width / 2, cyp = cv.height * 0.34;
  for (let i = 0; i < 26; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (60 + Math.random() * 150) * dpr;
    particles.push({
      x: cxp, y: cyp,
      r: (0.8 + Math.random() * 2) * dpr,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30 * dpr,
      a: 0.5 + Math.random() * 0.45,
      hue: Math.random() < 0.6 ? 162 : 44,
      life: 1.1
    });
  }
  if (particles.length > 190) particles.splice(0, particles.length - 190);
}

document.addEventListener("DOMContentLoaded", boot);
